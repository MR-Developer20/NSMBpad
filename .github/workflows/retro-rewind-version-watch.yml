name: Retro Rewind version watch

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  current-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        name: Check the official version feed
        shell: bash
        run: |
          set +e
          python3 scripts/check-retro-rewind-version.py --json > "$RUNNER_TEMP/retro-rewind.json"
          status=$?
          set -e
          cat "$RUNNER_TEMP/retro-rewind.json"
          if [[ "$status" != 0 && "$status" != 2 ]]; then
            exit "$status"
          fi
          echo "update_required=$(jq -r .updateRequired "$RUNNER_TEMP/retro-rewind.json")" >> "$GITHUB_OUTPUT"
          echo "pinned=$(jq -r .pinned "$RUNNER_TEMP/retro-rewind.json")" >> "$GITHUB_OUTPUT"
          echo "current=$(jq -r .current "$RUNNER_TEMP/retro-rewind.json")" >> "$GITHUB_OUTPUT"
      - name: Open one actionable compatibility issue
        if: steps.version.outputs.update_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.version.outputs.pinned }}
          CURRENT: ${{ steps.version.outputs.current }}
        shell: bash
        run: |
          title="Retro Rewind ${CURRENT} compatibility update"
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -1)"
          if [[ -n "$existing" ]]; then
            echo "Issue #${existing} already tracks ${CURRENT}."
            exit 0
          fi
          body="$RUNNER_TEMP/retro-rewind-issue.md"
          printf '%s\n' \
            "The daily watcher detected Retro Rewind ${CURRENT}; KartPad currently pins ${PINNED}." \
            "" \
            "Run \`python3 scripts/update-retro-rewind-profile.py --latest\`, review whether \`Code.pul\` changed, then follow \`docs/UPSTREAM_UPDATES.md\`. A changed \`Code.pul\` requires a new ahead-of-time KartPad build; do not weaken the executable or archive hash checks." \
            "" \
            "This issue was opened automatically by the Retro Rewind version watcher." > "$body"
          gh issue create --title "$title" --body-file "$body"
